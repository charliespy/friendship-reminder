[package]
name = "friends"
version = "0.1.2"
description = "A macOS menu bar app that reminds you to stay in touch with people"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "friends_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
friends-core = { path = "../crates/friends-core" }
friends-account = { path = "../crates/friends-account" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
chrono = { workspace = true, features = ["clock"] }
serde_json.workspace = true
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
rfd = { version = "0.18.0", default-features = false }

[features]
# Set by `tauri build`: serve the built front end from inside the app instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
# Sign in with Apple (AuthenticationServices) and the Keychain, for the account.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSObject", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
objc2-authentication-services = { version = "0.3", default-features = false, features = ["std", "ASAuthorization", "ASAuthorizationAppleIDCredential", "ASAuthorizationAppleIDProvider", "ASAuthorizationAppleIDRequest", "ASAuthorizationController", "ASAuthorizationCredential", "ASAuthorizationError", "ASAuthorizationOpenIDRequest", "ASAuthorizationProvider", "ASAuthorizationRequest", "ASFoundation"] }
security-framework = { version = "3", default-features = false }
