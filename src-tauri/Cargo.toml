[package]
name = "friends"
version = "0.2.0"
description = "A macOS menu bar app that reminds you to stay in touch with people"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "friends_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
friends-core = { path = "../crates/friends-core" }
friends-account = { path = "../crates/friends-account" }
friends-sync = { path = "../crates/friends-sync" }
serde.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
chrono = { workspace = true, features = ["clock"] }
serde_json.workspace = true
tauri-plugin-notification = "2"

# The Mac app: the menu bar, open at login, one copy at a time, and signing in through the browser.
[target.'cfg(target_os = "macos")'.dependencies]
# The one-off address the browser comes back to after Sign in with Apple.
tiny_http = "0.12"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
rfd = { version = "0.18.0", default-features = false }

# The iPhone app: Sign in with Apple in a sheet over the app.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-web-auth = { path = "plugins/web-auth" }
# The moment a booked reminder fires, as the notification plugin takes it.
time = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# The Keychain, for the account's session.
security-framework = { version = "3", default-features = false }

[features]
# Set by `tauri build`: serve the built front end from inside the app instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]

