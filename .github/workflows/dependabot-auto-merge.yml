name: Dependabot auto-merge

# Turns on GitHub's auto-merge for Dependabot's minor and patch updates of npm and Cargo packages,
# so they squash-merge once every required check on main passes (.github/rulesets/main.json).
# Major updates and GitHub Actions updates wait for a maintainer. scripts/dependabot-auto-merge.sh
# makes the call; scripts/test-dependabot-auto-merge.sh tests it.
#
# pull_request_target, because Dependabot's pull_request runs only get a read-only token. That event
# runs this file as it is on main, with a token that can write, so it must never run the PR's code:
# it checks out main (the default for this event), not the PR, and runs no package manager.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Turn on auto-merge
    # Only Dependabot's own PRs, from a branch in this repo (never a fork), in this repo.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.repository == 'charliespy/friendship-reminder'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main (never the PR)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Read what Dependabot is updating
        id: metadata
        # Fails unless every commit in the PR is Dependabot's own.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Turn on auto-merge for minor and patch updates
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/dependabot-auto-merge.sh
