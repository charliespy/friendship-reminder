name: Release

# Push a tag like v0.2.0 to build Friendship Reminder for macOS and publish it on GitHub Releases, with that
# version's section of CHANGELOG.md as the release description (docs/RELEASING.md has the steps).
# Signing and notarization switch on by themselves once these repository secrets exist:
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_API_ISSUER, APPLE_API_KEY (an App Store Connect API key's issuer ID and key ID) and
#   APPLE_API_KEY_PRIVATE_KEY_BASE64 (that key's .p8 file, base64).
# Without them the app is only ad-hoc signed (see the README for opening it).
# The account (Sign in with Apple) needs the repository variables FRIENDS_SUPABASE_URL and
# FRIENDS_SUPABASE_PUBLISHABLE_KEY. Without them the app builds as before, with the account unavailable.
# A PR that changes this file, the release script or the app version (a release PR), or a manual
# run, does a dry run: it prints the release plan and notes, builds the app and keeps the .dmg
# as a workflow artifact, but publishes nothing.
#
# Two jobs: the build runs npm and cargo with a read-only token; it cuts the release notes first,
# before any third-party code runs, then makes the .dmg. Only the small publish job, which runs no
# project code, may write (create the release from those two files), and only for a tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release.mjs"
      - "scripts/release-lib.mjs"
      - "src-tauri/tauri.conf.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The dry run needs the whole history and the tags to work out the next version; a release
          # build reads only the tagged files.
          fetch-depth: ${{ env.PUBLISH == 'true' && 1 || 0 }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Check the tag is a release tag on the release commit
        if: env.PUBLISH == 'true'
        run: |
          # Only vX.Y.Z tags are releases (no pre-releases).
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a vX.Y.Z release tag"
            exit 1
          fi
          # On the release PR's merge commit (docs/RELEASING.md step 6), not on a later one.
          subject=$(git log -1 --format=%s)
          case "$subject" in
            "chore(release): $GITHUB_REF_NAME"|"chore(release): $GITHUB_REF_NAME (#"*")") ;;
            *)
              echo "::error::$GITHUB_REF_NAME is on \"$subject\", not on the chore(release): $GITHUB_REF_NAME commit"
              exit 1
              ;;
          esac

      # Before the long setup and build: a release without its notes stops here, and publishes nothing.
      - name: Take the release notes from CHANGELOG.md
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p release-notes
          # --check-files: every version file must say the tag's version.
          node scripts/release.mjs notes "$GITHUB_REF_NAME" --check-files --out release-notes/release-notes.md
          cat release-notes/release-notes.md

      # Uploaded now, before npm ci and the build run any third-party code (that guards against
      # mistakes; code that could tamper with this job could also tamper with the .dmg).
      - name: Keep the release notes
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes/release-notes.md
          if-no-files-found: error
          # "Re-run failed jobs" uploads it again.
          overwrite: true
          retention-days: 7

      # On a release PR: checks the version (above the last release, the same in every file) and
      # prints the exact description tagging would publish (fails if it is empty). Otherwise the
      # plan: the commits come from the base branch's history, the files from the PR.
      - name: Dry run of the release plan and notes
        if: env.PUBLISH != 'true'
        run: node scripts/release.mjs dry-run

      # The steps above need only Node (the release script has no dependencies), so they fail
      # fast; the Rust toolchain and the npm packages come now.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci

      - name: Decide whether to sign
        id: signing
        if: env.PUBLISH == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_KEY_PRIVATE_KEY_BASE64 }}
        run: |
          missing=()
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PRIVATE_KEY_BASE64; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            # Tauri's notarization reads the API key from a file, so write the .p8 to the
            # runner's temp folder (deleted with the runner) and pass its path on.
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
            chmod 600 "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "Signing and notarizing."
          elif [ ${#missing[@]} -eq 6 ]; then
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Apple secrets: building an ad-hoc signed app."
          else
            echo "::error::Some Apple secrets are set but these are missing: ${missing[*]}"
            exit 1
          fi

      - name: Build (signed and notarized)
        if: steps.signing.outputs.sign == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          FRIENDS_SUPABASE_URL: ${{ vars.FRIENDS_SUPABASE_URL }}
          FRIENDS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.FRIENDS_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      # "-" signs ad hoc. An app with no signature at all is reported as "damaged" on Apple silicon,
      # with no way to open it from System Settings.
      - name: Build (ad-hoc signed)
        if: steps.signing.outputs.sign != 'true'
        env:
          APPLE_SIGNING_IDENTITY: "-"
          FRIENDS_SUPABASE_URL: ${{ vars.FRIENDS_SUPABASE_URL }}
          FRIENDS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.FRIENDS_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      # Tauri notarizes the .app but not the .dmg it is shipped in, and Gatekeeper checks the .dmg
      # when it is opened. So send the .dmg to Apple too and staple the ticket to it.
      - name: Notarize and staple the .dmg
        if: steps.signing.outputs.sign == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          result="$RUNNER_TEMP/notarize-dmg.json"
          xcrun notarytool submit "$dmg" "${auth[@]}" \
            --wait --timeout 60m --output-format json > "$result" || true
          cat "$result"
          read -r id status < <(python3 -c '
          import json, sys
          r = {}
          for line in open(sys.argv[1]):
              if line.lstrip().startswith("{"):
                  try:
                      r = json.loads(line)
                  except ValueError:
                      pass
          print(r.get("id") or "-", (r.get("status") or "unknown").replace(" ", "_"))
          ' "$result")
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarizing the .dmg ended with status '$status' (submission $id)"
            if [ "$id" != "-" ]; then
              xcrun notarytool log "$id" "${auth[@]}" || true
            fi
            exit 1
          fi
          # The ticket can take a moment to reach Apple's servers after it is accepted.
          for attempt in 1 2 3 4 5; do
            xcrun stapler staple "$dmg" && break
            [ "$attempt" -lt 5 ] || { echo "::error::could not staple the ticket to the .dmg"; exit 1; }
            sleep 30
          done
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -v "$dmg"

      - name: Check the signature
        run: |
          app=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          [ "$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | wc -l)" -eq 1 ] \
            || { echo "::error::expected exactly one .dmg"; exit 1; }
          mkdir -p dist-release
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist-release/

      # The .dmg: the publish job takes it from here.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.PUBLISH == 'true' && 'Friendship-Reminder' || 'Friendship-Reminder-dry-run' }}
          path: dist-release/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Friendship-Reminder
          path: dist-release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: release-notes
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes the build job cut from CHANGELOG.md (scripts/release.mjs notes); never
          # GitHub's generated notes, and never a release without them.
          [ -s release-notes/release-notes.md ] || { echo "::error::no release notes"; exit 1; }
          [ "$(ls dist-release/*.dmg | wc -l)" -eq 1 ] || { echo "::error::expected exactly one .dmg"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist-release/*.dmg --repo "$GITHUB_REPOSITORY" \
            --title "Friendship Reminder $GITHUB_REF_NAME" --notes-file release-notes/release-notes.md --verify-tag
