name: Release

# Push a tag like v0.2.0 to build Friends for macOS and publish it on GitHub Releases, with that
# version's section of CHANGELOG.md as the release description (docs/RELEASING.md has the steps).
# Signing and notarization switch on by themselves once these repository secrets exist:
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID.
# Without them the app is only ad-hoc signed (see the README for opening it).
# A PR that changes this file, the release script, CHANGELOG.md or the app version (a release PR), or a
# manual run, does a dry run: it prints the release plan and notes, builds the app and keeps the .dmg
# as a workflow artifact, but publishes nothing.
#
# Two jobs: the build runs npm and cargo with a read-only token; only the small publish job, which
# runs no project code, may write (create the release), and only for a tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release.mjs"
      - "scripts/release-lib.mjs"
      - "CHANGELOG.md"
      - "src-tauri/tauri.conf.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The whole history and the tags, so the dry run can work out the next version.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci

      - name: Check the tag matches the app version
        if: env.PUBLISH == 'true'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$app" ]; then
            echo "::error::tag v$tag doesn't match the version in src-tauri/tauri.conf.json ($app)"
            exit 1
          fi

      # Before the long build: a release without its notes stops here, and publishes nothing.
      - name: Take the release notes from CHANGELOG.md
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p dist-release
          node scripts/release.mjs notes "$GITHUB_REF_NAME" --out dist-release/release-notes.md
          cat dist-release/release-notes.md

      - name: Dry run of the release plan and notes
        if: env.PUBLISH != 'true'
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if node scripts/release.mjs notes "$version" > /dev/null 2>&1; then
            # A release PR (or main after one): v$version is prepared and waits for its tag.
            echo "Tagging v$version would publish it with this description:"
            echo
            node scripts/release.mjs notes "$version"
          else
            code=0
            node scripts/release.mjs plan || code=$?
            # 3 = nothing to release yet, which is fine for a dry run.
            [ "$code" -eq 0 ] || [ "$code" -eq 3 ] || exit "$code"
          fi

      - name: Decide whether to sign
        id: signing
        if: env.PUBLISH == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "Signing and notarizing."
          elif [ ${#missing[@]} -eq 6 ]; then
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Apple secrets: building an ad-hoc signed app."
          else
            echo "::error::Some Apple secrets are set but these are missing: ${missing[*]}"
            exit 1
          fi

      - name: Build (signed and notarized)
        if: steps.signing.outputs.sign == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      # "-" signs ad hoc. An app with no signature at all is reported as "damaged" on Apple silicon,
      # with no way to open it from System Settings.
      - name: Build (ad-hoc signed)
        if: steps.signing.outputs.sign != 'true'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: Check the signature
        run: |
          app=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          [ "$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | wc -l)" -eq 1 ] \
            || { echo "::error::expected exactly one .dmg"; exit 1; }
          mkdir -p dist-release
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist-release/

      # The .dmg and, for a release, the notes: the publish job takes both from here.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.PUBLISH == 'true' && 'Friends' || 'Friends-dry-run' }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Friends
          path: dist-release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes the build job cut from CHANGELOG.md (scripts/release.mjs notes); never
          # GitHub's generated notes, and never a release without them.
          [ -s dist-release/release-notes.md ] || { echo "::error::no release notes"; exit 1; }
          [ "$(ls dist-release/*.dmg | wc -l)" -eq 1 ] || { echo "::error::expected exactly one .dmg"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist-release/*.dmg --repo "$GITHUB_REPOSITORY" \
            --title "Friends $GITHUB_REF_NAME" --notes-file dist-release/release-notes.md --verify-tag
