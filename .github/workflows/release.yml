name: Release

# Push a tag like v0.2.0 to build Friends for macOS and publish it on GitHub Releases.
# Signing and notarization switch on by themselves once these repository secrets exist:
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID.
# Without them the app is built unsigned (see the README for opening an unsigned app).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$app" ]; then
            echo "::error::tag v$tag doesn't match the version in src-tauri/tauri.conf.json ($app)"
            exit 1
          fi

      - name: Decide whether to sign
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "Signing and notarizing."
          elif [ ${#missing[@]} -eq 6 ]; then
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Apple secrets: building an unsigned app."
          else
            echo "::error::Some Apple secrets are set but these are missing: ${missing[*]}"
            exit 1
          fi

      - name: Build (signed and notarized)
        if: steps.signing.outputs.sign == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: Build (unsigned)
        if: steps.signing.outputs.sign != 'true'
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md)
          [ -n "$notes" ] || notes="See CHANGELOG.md."
          gh release create "$GITHUB_REF_NAME" "$dmg" --title "Friends $GITHUB_REF_NAME" --notes "$notes" --verify-tag
