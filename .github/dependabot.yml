# Dependabot checks for new versions once a week. Minor and patch updates come as one PR per
# ecosystem (the "minor-and-patch" group), and .github/workflows/dependabot-auto-merge.yml merges
# the npm and Cargo ones once every required check passes. A major update comes as a PR of its own
# and waits for a maintainer. PR titles are conventional commits ("chore(deps): ...",
# "ci(deps): ..."), so they pass the PR title check.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: ci
      include: scope
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
